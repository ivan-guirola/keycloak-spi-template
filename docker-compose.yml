services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command: start-dev --spi-events-listener--login-audit--events=LOGIN,LOGIN_ERROR,LOGOUT,REGISTER
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./target/keycloak-spi-template.jar:/opt/keycloak/providers/keycloak-spi-template.jar:ro
